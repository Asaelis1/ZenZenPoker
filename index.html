<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Zen Poker — Garden Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --felt: #0e3a27;
    --felt2: #145c3a;
    --ivory: #f6edd8;
    --brass: #d4af5a;
    --brass2: #f0d48a;
    --burgundy: #9a2f2f;
    --hud-h: 44px;
    --footer-h: 78px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #app {
    margin: 0; height: 100%; height: 100dvh; width: 100%;
    overflow: hidden; background: #06140c; color: var(--ivory);
    font-family: "Source Sans 3", sans-serif;
  }
  #app { padding: 0; display: flex; flex-direction: column; }

  .stage {
    position: relative; flex: 1; min-height: 0; width: 100%;
    display: flex; flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 38%, #1a6a42 0%, var(--felt2) 38%, var(--felt) 72%, #07180f 100%);
    box-shadow: inset 0 0 0 3px #8a6a2a, inset 0 0 0 6px #d4af5a, inset 0 0 0 8px #6d5318, inset 0 0 80px rgba(0,0,0,.28);
    padding-top: var(--safe-t); padding-bottom: var(--safe-b);
    padding-left: var(--safe-l); padding-right: var(--safe-r);
  }
  .frame {
    pointer-events: none; position: absolute; inset: 8px; border-radius: 12px;
    border: 1.5px solid rgba(212,175,90,.55); z-index: 2;
  }
  .frame:after {
    content: ""; position: absolute; inset: 5px; border-radius: 8px;
    border: 1px solid rgba(240,212,138,.28);
  }
  .corner { position: absolute; width: 72px; height: 72px; pointer-events: none; z-index: 3; opacity: .85; }
  .corner.tl { top: 2px; left: 2px; } .corner.tr { top: 2px; right: 2px; transform: scaleX(-1); }
  .corner.bl { bottom: 2px; left: 2px; transform: scaleY(-1); } .corner.br { bottom: 2px; right: 2px; transform: scale(-1); }

  header.hud {
    position: relative; z-index: 6; flex: 0 0 auto;
    height: var(--hud-h); min-height: var(--hud-h); max-height: var(--hud-h);
    display: flex; align-items: center; gap: 6px;
    padding: 0 10px 0 14px;
  }
  .brand {
    font-family: "Cormorant Garamond", serif; font-size: 20px; color: var(--brass2);
    display: flex; align-items: center; gap: 6px; letter-spacing: .03em;
    cursor: default; user-select: none; white-space: nowrap;
  }
  .road-label {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #f3e2b0; padding: 3px 10px;
    border: 1px solid rgba(212,175,90,.45); border-radius: 999px;
    background: linear-gradient(180deg, rgba(20,50,32,.55), rgba(8,24,16,.55));
    pointer-events: none; cursor: default; user-select: none;
  }
  .pill {
    border: 1.5px solid var(--brass); border-radius: 999px; padding: 3px 10px;
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #f3e2b0;
    background: linear-gradient(180deg, rgba(20,50,32,.75), rgba(8,24,16,.75));
    white-space: nowrap;
  }
  .icon-btn {
    width: 34px; height: 34px; min-width: 34px; border-radius: 50%; border: 1.5px solid var(--brass);
    background: radial-gradient(circle at 40% 30%, #1d5a38, #0c2418); color: var(--brass2);
    cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
    padding: 0; flex-shrink: 0;
  }
  .spacer { flex: 1; min-width: 4px; }
  .combo-banner {
    position: absolute; left: 50%; top: calc(var(--hud-h) + 2px); transform: translateX(-50%);
    z-index: 7; border: 1px solid var(--brass); border-radius: 999px; padding: 2px 14px;
    color: var(--brass2); letter-spacing: .14em; font-size: 10px;
    background: rgba(8,24,16,.75); pointer-events: none;
  }

  .content {
    position: relative; z-index: 5; flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden;
    padding: 0 12px;
  }

  /* —— Garden Road —— */
  .road-screen {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px;
    padding-bottom: 6px;
  }
  .chapter-tag {
    font-size: 10px; letter-spacing: .18em; color: var(--brass);
    text-align: center; flex: 0 0 auto; margin: 0;
  }
  .road {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1.2fr .9fr; gap: 10px;
  }
  .path {
    min-height: 0; border-radius: 12px; padding: 8px;
    background:
      radial-gradient(circle at 20% 70%, rgba(90,140,70,.18), transparent 40%),
      linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.18));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .chap-tabs {
    display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
    flex: 0 0 auto; padding-bottom: 4px; scrollbar-width: none;
  }
  .chap-tabs::-webkit-scrollbar { display: none; }
  .chap-tab {
    flex: 0 0 auto; border: 1px solid rgba(212,175,90,.4); background: rgba(8,24,16,.5);
    color: #d7c48a; border-radius: 999px; padding: 2px 8px; font-size: 9px;
    letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
  }
  .chap-tab.on { border-color: var(--brass2); color: var(--brass2); background: rgba(40,70,40,.6); }
  .nodes {
    flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 8px;
    align-content: center; justify-content: center; align-items: center;
  }
  .node {
    width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
    border: 2px solid #8a6a2a; color: #f0d48a;
    background: radial-gradient(circle at 35% 30%, #2a6a40, #102418);
    box-shadow: 0 4px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    font-weight: 700; font-size: 13px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0; flex-shrink: 0;
  }
  .node.on {
    border-color: #f0d48a;
    box-shadow: 0 0 0 3px rgba(212,175,90,.4), 0 0 18px rgba(240,212,138,.4);
  }
  .node.lock { opacity: .4; cursor: not-allowed; filter: grayscale(.3); }
  .node small { font-size: 8px; color: var(--brass); line-height: 1; }
  .panel {
    min-height: 0; overflow: hidden;
    background: linear-gradient(180deg, rgba(18,42,28,.92), rgba(8,22,16,.95));
    border: 1.5px solid var(--brass); border-radius: 12px; padding: 10px 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,.28);
    display: flex; flex-direction: column; justify-content: center;
  }
  .panel h2 { font-family: "Cormorant Garamond", serif; margin: 0 0 2px; color: #f6edd8; font-size: 22px; line-height: 1.1; }
  .panel p { margin: 2px 0; color: #e4d5ae; font-size: 12px; line-height: 1.25; }
  .diff {
    display: inline-block; font-size: 9px; letter-spacing: .12em; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; margin-top: 2px;
  }
  .diff.gentle { background: rgba(80,140,90,.35); color: #b8e0b0; border: 1px solid #6a9a60; }
  .diff.hard { background: rgba(160,100,40,.4); color: #f0c080; border: 1px solid #c08040; }
  .diff.extreme { background: rgba(140,40,40,.45); color: #f0a0a0; border: 1px solid #c05050; }
  button.gold, button.ghost {
    cursor: pointer; border-radius: 10px; padding: 8px 14px; letter-spacing: .08em;
    text-transform: uppercase; font-weight: 700; font-size: 12px;
  }
  button.gold {
    background: linear-gradient(180deg, #f0d48a, #c49a3e); color: #1b1406; border: 0;
    box-shadow: 0 3px 0 #7a5c1c;
  }
  button.ghost { background: transparent; color: var(--brass2); border: 1.5px solid var(--brass); }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

  /* —— Table —— */
  .play-screen {
    flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  .board-area {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
  }
  .board { position: absolute; inset: 0; }
  .card {
    position: absolute; width: var(--cw, 56px); height: var(--ch, 84px); border: 0; padding: 0;
    background: transparent; cursor: pointer;
    filter: drop-shadow(0 5px 7px rgba(0,0,0,.32));
    transition: transform .12s ease, filter .2s ease;
  }
  .card img, .slot img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .card:not(.blocked):hover { transform: translateY(-5px); }
  .card.blocked { cursor: default; filter: brightness(.78) drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  .card.wild { outline: 2px solid #b23a3a; outline-offset: -2px; border-radius: 8px; }
  .card.hint-glow {
    filter: drop-shadow(0 0 10px #f0d48a) drop-shadow(0 0 18px #d4af5a) brightness(1.15);
    transform: translateY(-6px) scale(1.04);
    z-index: 40 !important;
  }
  .card.peeking { z-index: 41 !important; }
  .wild-dot {
    position: absolute; right: 3px; bottom: 4px; width: 14px; height: 14px; border-radius: 50%;
    background: #9a2f2f; color: #f6edd8; font-size: 9px; line-height: 14px; text-align: center;
  }
  .footer {
    position: relative; z-index: 6; flex: 0 0 auto;
    height: var(--footer-h); min-height: var(--footer-h); max-height: var(--footer-h);
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    padding: 2px 8px 4px;
  }
  .tray {
    display: flex; gap: 4px; height: 70px; padding: 4px 6px; align-items: center;
    border: 1.5px solid var(--brass); border-radius: 12px;
    background: rgba(6,20,12,.4); overflow: hidden;
  }
  .slot { width: 46px; height: 69px; position: relative; flex-shrink: 0; }
  .slot.empty {
    border-radius: 6px; border: 1px dashed rgba(212,175,90,.35);
    background: rgba(246,237,216,.06); width: 46px; height: 69px;
  }
  .wells { display: flex; gap: 6px; align-items: center; }
  .well {
    width: 58px; height: 58px; min-width: 44px; min-height: 44px;
    border-radius: 50%; cursor: pointer;
    border: 2px solid var(--brass);
    background: radial-gradient(circle at 35% 30%, #1b5a38, #0a2418);
    color: var(--brass2); letter-spacing: .04em; font-size: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    box-shadow: inset 0 0 0 2px rgba(14,58,39,.65), 0 4px 10px rgba(0,0,0,.28);
    padding: 0; line-height: 1.05;
  }
  .well:disabled { opacity: .35; cursor: not-allowed; }
  .well b { font-size: 15px; font-weight: 500; }
  .status-line {
    flex: 0 0 auto; font-size: 13px; font-weight: 600; color: #f3e6c2;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); padding: 0 4px 2px;
    letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 9;
    background: #13281c; border: 1px solid var(--brass); color: #f3e6c2;
    padding: 5px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap;
    pointer-events: none;
  }

  /* —— Modals —— */
  .modal-back {
    position: absolute; inset: 0; background: rgba(4,12,8,.7); z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 10px;
  }
  .modal {
    width: min(520px, 94vw); max-height: 92%; overflow: auto;
    background: #f6edd8; color: #1c2a22; border-radius: 16px;
    border: 2px solid #c7a24a; padding: 16px 18px; box-shadow: 0 20px 40px rgba(0,0,0,.45);
  }
  .modal h2 { font-family: "Cormorant Garamond", serif; margin: 0 0 8px; text-align: center; font-size: 28px; }
  .modal.dark {
    background: linear-gradient(180deg, #1a3a28, #0e2418); color: var(--ivory);
    border-color: var(--brass);
  }
  .pay { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 3px 14px; font-size: 12px; }
  .log { font-size: 12px; border-top: 1px solid #d8c394; margin-top: 8px; padding-top: 6px; }
  .log div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid rgba(212,175,90,.25); font-size: 14px;
  }
  .settings-row:last-of-type { border-bottom: 0; }
  .toggle {
    width: 48px; height: 26px; border-radius: 999px; border: 1.5px solid var(--brass);
    background: #0a1c12; position: relative; cursor: pointer; flex-shrink: 0; padding: 0;
  }
  .toggle.on { background: #2a6a40; }
  .toggle i {
    position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--brass2); transition: left .15s;
  }
  .toggle.on i { left: 24px; }
  .review-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .review-row input {
    width: 72px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--brass);
    background: #0a1c12; color: var(--ivory); font-size: 14px;
  }

  /* —— Splash —— */
  .splash {
    position: absolute; inset: 0; z-index: 40;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 40%, #1a6a42 0%, var(--felt2) 40%, var(--felt) 75%, #06140c 100%);
    cursor: pointer;
  }
  .splash-cards {
    display: flex; gap: 8px; margin-bottom: 28px; height: 110px; align-items: flex-end;
  }
  .splash-card {
    width: 64px; height: 96px; border-radius: 8px; overflow: hidden;
    box-shadow: 0 8px 18px rgba(0,0,0,.4);
    transform: translateY(40px) rotateY(90deg); opacity: 0;
    animation: dealIn .55s ease forwards;
  }
  .splash-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .splash-card:nth-child(1){ animation-delay: .1s; }
  .splash-card:nth-child(2){ animation-delay: .25s; }
  .splash-card:nth-child(3){ animation-delay: .4s; }
  .splash-card:nth-child(4){ animation-delay: .55s; }
  .splash-card:nth-child(5){ animation-delay: .7s; }
  @keyframes dealIn {
    to { transform: translateY(0) rotateY(0); opacity: 1; }
  }
  .splash-word {
    text-align: center; opacity: 0; animation: fadeWord .6s ease .95s forwards;
  }
  .splash-word .z {
    font-family: "Cormorant Garamond", serif; font-size: 56px; color: var(--brass2);
    letter-spacing: .08em; line-height: 1; display: block;
  }
  .splash-word .p {
    font-family: "Libre Baskerville", serif; font-size: 28px; color: #e4d5ae;
    letter-spacing: .28em; text-transform: uppercase; display: block; margin-top: 4px;
  }
  .splash-hint {
    margin-top: 24px; font-size: 12px; letter-spacing: .2em; color: rgba(240,212,138,.7);
    text-transform: uppercase; opacity: 0; animation: fadeWord .5s ease 1.4s forwards;
  }
  @keyframes fadeWord { to { opacity: 1; } }

  /* —— Portrait gate —— */
  .portrait-gate {
    position: absolute; inset: 0; z-index: 50;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: #06140c; text-align: center; padding: 24px;
  }
  .portrait-gate.show { display: flex; }
  .portrait-gate .rotate-icon {
    font-size: 64px; margin-bottom: 16px; animation: tilt 1.6s ease-in-out infinite;
  }
  @keyframes tilt {
    0%,100% { transform: rotate(0deg); }
    40% { transform: rotate(90deg); }
    60% { transform: rotate(90deg); }
  }
  .portrait-gate h1 {
    font-family: "Cormorant Garamond", serif; font-size: 32px; color: var(--brass2); margin: 0 0 8px;
  }
  .portrait-gate p { color: #d7c48a; font-size: 14px; letter-spacing: .06em; }

  /* —— Gold bloom —— */
  .bloom {
    position: absolute; inset: 0; z-index: 25;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(212,175,90,.35), rgba(6,20,12,.72) 70%);
    pointer-events: none; animation: bloomFlash 1.8s ease forwards;
  }
  .bloom .hand-name {
    font-family: "Cormorant Garamond", serif; font-size: clamp(28px, 8vw, 52px);
    color: #fff6d0; text-shadow: 0 0 24px #d4af5a, 0 2px 8px rgba(0,0,0,.5);
    letter-spacing: .06em; margin: 0;
  }
  .bloom .hand-math {
    margin-top: 8px; font-size: clamp(16px, 4vw, 24px); color: #f0d48a;
    letter-spacing: .08em;
  }
  @keyframes bloomFlash {
    0% { opacity: 0; }
    12% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Short landscape: keep road side-by-side, compact nodes */
  @media (max-height: 420px) and (orientation: landscape) {
    .node { width: 40px; height: 40px; font-size: 11px; gap: 0; }
    .node small { font-size: 7px; }
    .nodes { gap: 6px; }
    .panel h2 { font-size: 18px; }
    .panel p { font-size: 11px; margin: 1px 0; }
    button.gold, button.ghost { padding: 6px 12px; font-size: 11px; }
    .well { width: 48px; height: 48px; font-size: 7px; }
    .well b { font-size: 13px; }
    .slot, .slot.empty { width: 40px; height: 60px; }
    .tray { height: 64px; }
    .brand { font-size: 17px; }
    .splash-card { width: 48px; height: 72px; }
    .splash-word .z { font-size: 40px; }
    .splash-word .p { font-size: 20px; }
  }
  @media (min-width: 700px) and (max-height: 420px) {
    .well { width: 72px; height: 72px; font-size: 8px; }
    .well b { font-size: 17px; }
    :root { --footer-h: 78px; --hud-h: 42px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========== Constants ========== */
const PAY = { high:25, pair:50, twopair:120, three:200, straight:400, flush:500, full:700, four:900, five:1600, sflush:1400, royal:2000 };
const NAMES = { high:"High Card", pair:"Pair", twopair:"Two Pair", three:"Three of a Kind", straight:"Straight", flush:"Flush", full:"Full House", four:"Four of a Kind", five:"Five of a Kind", sflush:"Straight Flush", royal:"Royal Flush" };
const ORDER = ["high","pair","twopair","three","straight","flush","full","four","five","sflush","royal"];
const BLOOM_HANDS = new Set(["straight","flush","full","four","five","sflush","royal"]);
const SUITS = ["H","D","C","S"];
const RANKS = ["A","K","Q","J","T","9","8","7","6","5","4","3","2"];
const DECK = RANKS.flatMap(r => SUITS.map(s => r + s));
const RV = {A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2};
const CHAPTERS = [
  {id:1, name:"The Hedge"},
  {id:2, name:"The Orchard"},
  {id:3, name:"Lantern Walk"},
  {id:4, name:"Moss Court"},
  {id:5, name:"Stone Path"},
  {id:6, name:"The Crown"},
  {id:7, name:"Mirror Pool"},
  {id:8, name:"Night Bloom"},
  {id:9, name:"Thorn Gate"},
  {id:10, name:"Zen Crown"}
];
const BED_NAMES = [
  "Lantern","Quiet Rail","Moss Grove","Ivy Arch","Twin Lamps","Dew Path","Cedar Bend","Fern Hollow","Stone Seat","Hedge Gate",
  "Orchard Gate","Apple Row","Pear Shade","Blossom Arch","Bee Walk","Cider Stone","Root Bridge","Leaf Spiral","Petal Fall","Orchard Crown",
  "Copper Lamp","Night Wick","Glow Path","Moth Seat","Amber Pool","Soft Flame","Wisp Lane","Ember Arch","Candle Row","Lantern Peak",
  "Velvet Moss","Fern Throne","Shade Ring","Damp Stair","Fungus Arch","Green Mirror","Lichen Wall","Soft Carpet","Root Nest","Moss Crown",
  "Flagstone","Quiet Mile","Bench Bend","Rill Crossing","Gravel Spiral","Mile Marker","Dust Arch","Warm Stone","Path Fork","Stone Peak",
  "Laurel Ring","Gold Trellis","Diadem Path","Royal Ivy","Scepter Seat","Coronet Pool","Throne Shade","Jewel Arch","Crest Walk","Garden Crown",
  "Still Water","Ripple Gate","Silver Shore","Echo Bridge","Lily Disk","Twin Reflection","Deep Glass","Moon Basin","Shore Path","Mirror Peak",
  "Night Petal","Star Bloom","Owl Seat","Shadow Vine","Midnight Dew","Bat Arch","Dark Orchid","Velvet Night","Glow Moth","Bloom Peak",
  "Bramble Gate","Thorn Spiral","Spike Arch","Needle Path","Rose Armor","Wire Vine","Jagged Seat","Red Briar","Guard Thorn","Thorn Peak",
  "Empty Seat","Breath Path","Single Stone","Quiet Mind","Ink Pool","Zero Arch","Still Crown","Final Leaf","Last Lamp","Zen Peak"
];

const SAVE_KEY = "zen-poker-web-review-v3";

/* ========== Seeded RNG ========== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffleArr(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ========== Difficulty ========== */
function difficultyFor(n){
  const decade = n % 10 === 0;
  if (n >= 81 || (decade && n >= 60)) return "extreme";
  if (n >= 31 || decade) return "hard";
  return "gentle";
}
function diffLabel(d){
  if (d === "extreme") return "EXTREME HARD";
  if (d === "hard") return "HARD";
  return "Gentle";
}

/* ========== Level generation ========== */
function pack(rows){
  let id = 1;
  return rows.flatMap(row => row.codes.map((code, i) => ({
    id: id++, code, x: row.x0 + i * row.gap, y: row.y, z: row.z
  })));
}
function targetFor(n, cardCount, diff){
  const base = 180 + n * 18 + cardCount * 12;
  const mult = diff === "extreme" ? 1.55 : diff === "hard" ? 1.25 : 1.0;
  return Math.round(base * mult / 10) * 10;
}
function generateLevel(n){
  const rnd = mulberry32((0x5EED ^ (n * 2654435761)) >>> 0);
  const diff = difficultyFor(n);
  const chIdx = Math.ceil(n / 10) - 1;
  const chapter = CHAPTERS[chIdx];

  let cardCount;
  if (n >= 97) cardCount = 55 + Math.floor(rnd() * 6); // 55–60 two packs
  else if (n >= 81) cardCount = 36 + Math.floor(rnd() * 10);
  else if (n >= 51) cardCount = 28 + Math.floor(rnd() * 10);
  else if (n >= 31) cardCount = 24 + Math.floor(rnd() * 8);
  else if (n >= 11) cardCount = 20 + Math.floor(rnd() * 6);
  else cardCount = 16 + Math.floor(rnd() * 6);

  const pool = n >= 97
    ? shuffleArr(DECK.concat(DECK), rnd).slice(0, cardCount)
    : shuffleArr(DECK, rnd).slice(0, Math.min(cardCount, 52));
  // if need more than 52 below 97, wrap
  while (pool.length < cardCount) {
    pool.push(...shuffleArr(DECK, rnd).slice(0, cardCount - pool.length));
  }

  const layers = n >= 81 ? 5 : n >= 51 ? 4 : n >= 21 ? 4 : 3;
  const rows = [];
  let left = pool.slice();
  const overlapBoost = diff === "extreme" ? 0.85 : diff === "hard" ? 0.92 : 1.0;

  for (let z = layers - 1; z >= 0; z--) {
    const share = z === 0 ? left.length : Math.max(4, Math.floor(left.length / (z + 1) * (0.7 + rnd() * 0.4)));
    const take = Math.min(left.length, Math.min(share, z === layers - 1 ? Math.ceil(cardCount / layers) + 2 : share));
    const codes = left.splice(0, take);
    if (!codes.length) break;
    const gap = (9.5 + rnd() * 2.5) * overlapBoost;
    const span = (codes.length - 1) * gap;
    const x0 = Math.max(2, Math.min(30, 50 - span / 2 + (rnd() - 0.5) * 8));
    const yBase = 2 + (layers - 1 - z) * (12 + rnd() * 4);
    rows.push({ codes, x0, gap, y: yBase, z });
  }
  // leftover
  if (left.length) {
    const gap = 10;
    const span = (left.length - 1) * gap;
    rows.push({ codes: left, x0: Math.max(2, 50 - span / 2), gap, y: 2 + layers * 13, z: 0 });
  }

  const cards = pack(rows);
  const target = targetFor(n, cards.length, diff);
  return {
    id: "bed-" + n,
    n,
    name: BED_NAMES[n - 1] || ("Bed " + n),
    ch: chapter.name,
    chapter: chapter.id,
    diff,
    target,
    cards
  };
}

const LEVELS = Array.from({ length: 100 }, (_, i) => generateLevel(i + 1));

/* ========== Save / settings ========== */
function storage(){
  try { const ls = window.localStorage; ls.getItem(SAVE_KEY); return ls; }
  catch { return null; }
}
function defaultSave(){
  return {
    stars: {}, best: {}, unlocked: 1,
    settings: { music: true, fx: true, haptics: true, silent: false },
    reviewUnlocked: false,
    splashSeen: false
  };
}
function loadSave(){
  try {
    const ls = storage();
    if (!ls) return defaultSave();
    const raw = JSON.parse(ls.getItem(SAVE_KEY) || "null");
    if (!raw) return defaultSave();
    return Object.assign(defaultSave(), raw, {
      settings: Object.assign(defaultSave().settings, raw.settings || {})
    });
  } catch { return defaultSave(); }
}
function writeSave(s){
  try { const ls = storage(); if (ls) ls.setItem(SAVE_KEY, JSON.stringify(s)); } catch {}
}
function starsFor(score, target){
  if (score <= 0) return 0;
  if (score >= Math.floor(target * 0.9)) return 3;
  if (score >= Math.floor(target * 0.55)) return 2;
  return 1;
}

/* ========== Audio / haptics ========== */
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  }
  return audioCtx;
}
function tone(freq, dur, type, gain){
  if (save.settings.silent || !save.settings.fx) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gain || 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(gain || 0.04, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}
let padNodes = null;
function startPad(){
  stopPad();
  if (save.settings.silent || !save.settings.music) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const g = ctx.createGain();
    g.gain.value = 0.018;
    g.connect(ctx.destination);
    const freqs = [196, 247];
    const oscs = freqs.map(f => {
      const o = ctx.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); o.start();
      return o;
    });
    padNodes = { oscs, g };
  } catch {}
}
function stopPad(){
  if (!padNodes) return;
  try { padNodes.oscs.forEach(o => o.stop()); } catch {}
  padNodes = null;
}
function syncPad(){
  if (save.settings.silent || !save.settings.music) stopPad();
  else if (!padNodes) startPad();
}
function chimePick(){ tone(523, 0.08, "sine", 0.035); }
function chimePair(){ tone(660, 0.1, "sine", 0.04); tone(880, 0.12, "sine", 0.03); }
function chimeBloom(){
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.18, "triangle", 0.05), i * 120));
}
function vibe(pattern){
  if (save.settings.silent || !save.settings.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}

/* ========== Card helpers ========== */
function parse(code){ return { r: code.slice(0, -1), s: code.slice(-1) }; }
function classify(cards){
  const ranks = cards.map(c => RV[c.r]).sort((a, b) => b - a);
  const suits = cards.map(c => c.s);
  const flush = suits.every(s => s === suits[0]);
  const uniq = [...new Set(ranks)];
  let straight = 0;
  if (uniq.length === 5 && uniq[0] - uniq[4] === 4) straight = uniq[0];
  if (String(uniq) === "14,5,4,3,2") straight = 5;
  const counts = {}; ranks.forEach(v => counts[v] = (counts[v] || 0) + 1);
  const sig = Object.values(counts).sort((a, b) => b - a).join("");
  if (flush && straight === 14) return "royal";
  if (flush && straight) return "sflush";
  if (sig === "5") return "five";
  if (sig === "41") return "four";
  if (sig === "32") return "full";
  if (flush) return "flush";
  if (straight) return "straight";
  if (sig === "311") return "three";
  if (sig === "221") return "twopair";
  if (sig === "2111") return "pair";
  return "high";
}
function bestWithWild(cards){
  const wilds = cards.filter(c => c.wild);
  const plain = cards.filter(c => !c.wild);
  if (!wilds.length) { const cat = classify(cards); return { cat, pts: PAY[cat] }; }
  let best = { cat: "high", pts: PAY.high };
  for (const r of Object.keys(RV)) for (const s of SUITS) {
    const cat = classify(plain.concat(wilds.map(() => ({ r, s }))));
    if (ORDER.indexOf(cat) > ORDER.indexOf(best.cat)) best = { cat, pts: PAY[cat] };
  }
  return best;
}
function norm(code){ return code.replace("10", "T"); }
function faceFile(code){
  const n = norm(code);
  const { r, s } = parse(n);
  const rank = r === "T" ? "10" : r;
  return "cards/" + rank + s + ".png";
}
function cardFace(code, wild){
  if (wild) return `<img src="cards/JOKER.png" alt="wild" width="256" height="384"/><span class="wild-dot">★</span>`;
  return `<img src="${faceFile(code)}" alt="${code}" width="256" height="384"/>`;
}
function cardBack(){
  return `<img src="cards/BACK.png" alt="back" width="256" height="384"/>`;
}
function ivySVG(){
  return `<svg viewBox="0 0 120 120" width="72" height="72" fill="none">
    <path d="M8 86c18-8 28-28 26-48 14 8 18 24 12 40 16-10 34-8 48 4-18 6-38 4-52-8-4 14-16 26-34 30z" fill="#3f7a4a"/>
    <path d="M18 70c10-18 8-36-2-48 16 4 24 18 22 34 12-14 28-16 40-8-16 10-30 8-40 0-2 12-10 22-20 22z" fill="#6ea25a"/>
    <path d="M10 40c12-6 16-20 10-32 10 8 10 20 4 28 10-4 20 0 28 8-12 2-22-2-28-8 0 8-6 14-14 16z" fill="#87b56a"/>
    <circle cx="22" cy="28" r="3" fill="#d4af5a"/>
  </svg>`;
}

let toast = "";
let showPay = false;
let showSettings = false;

let showBloom = null; // {name, math} or null
let bloomBusy = false;
let brandTaps = 0;
let brandTapTimer = null;
let hintId = null;
let peekId = null;

else if (!skipSplash) showSplash = true; // always show splash on load unless skip
if (skipSplash) showSplash = false;

function cloneLevel(lv){ return lv.cards.map(c => ({ ...c, gone: false, wild: false })); }
function startLevel(lv){
  selected = lv;
  chapterView = lv.chapter;
  game = {
    level: lv, cards: cloneLevel(lv), tray: [], score: 0, combo: 1, log: [],
    undo: 3, shuffle: 3, joker: 1, hint: 2, peek: 2,
    arming: false, snap: null, last: null
  };
  toast = ""; showBloom = null; bloomBusy = false; hintId = null; peekId = null;
  view = "play";
  syncPad();
  render();
}
function rect(c){ return { x: c.x, y: c.y, w: 11, h: 22 }; }
function overlap(a, b){
  const A = rect(a), B = rect(b);
  const x = Math.max(0, Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x));
  const y = Math.max(0, Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y));
  return (x * y) / (A.w * A.h) > 0.18;
}
function blocked(card, cards){ return cards.some(o => !o.gone && o.z > card.z && overlap(card, o)); }
function live(cards){ return cards.filter(c => !c.gone); }
function freeCards(){ return live(game.cards).filter(c => !blocked(c, game.cards)); }
function toTray(c){
  if (c.gone) return;
  c.gone = true;
  game.tray.push({ ...parse(norm(c.code)), code: norm(c.code), wild: !!c.wild, id: c.id });
}
function snapshot(){
  return JSON.parse(JSON.stringify({
    cards: game.cards, tray: game.tray, score: game.score, combo: game.combo,
    log: game.log, joker: game.joker, hint: game.hint, peek: game.peek
  }));
}
function autoLastHand(){
  if (!game || game.arming || bloomBusy) return false;
  const left = live(game.cards);
  const free = freeCards();
  const trayN = game.tray.length;
  let take = null;
  if (left.length && left.length + trayN === 5) take = left;
  else if (free.length && free.length + trayN === 5) take = free;
  if (!take) return false;
  if (!trayN) game.snap = snapshot();
  take.forEach(toTray);
  if (game.tray.length === 5) resolve();
  return true;
}
function pick(id){
  if (bloomBusy) return;
  const c = game.cards.find(x => x.id === id);
  if (!c || c.gone || blocked(c, game.cards)) return;
  if (game.arming) {
    c.wild = true; game.arming = false; game.joker = 0;
    toast = "Joker planted"; vibe(20); chimePick(); render(); return;
  }
  if (game.tray.length >= 5) return;
  if (!game.tray.length) game.snap = snapshot();
  toTray(c);
  chimePick(); vibe(12);
  if (game.tray.length === 5) resolve();
  else autoLastHand();
  render();
}
function undo(){
  if (game.undo <= 0 || !game.snap || bloomBusy) return;
  const keep = { undo: game.undo - 1, shuffle: game.shuffle, hint: game.hint, peek: game.peek, level: game.level };
  Object.assign(game, JSON.parse(JSON.stringify(game.snap)), keep);
  game.snap = null; game.arming = false; toast = "Undo"; vibe(15); render();
}
function shuffle(){
  if (game.shuffle <= 0 || bloomBusy) return;
  const open = live(game.cards);
  const codes = open.map(c => c.code);
  for (let i = codes.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [codes[i], codes[j]] = [codes[j], codes[i]];
  }
  open.forEach((c, i) => { c.code = codes[i]; c.wild = false; });
  game.shuffle--; game.combo = 1; game.score = Math.max(0, game.score - 50);
  toast = "Shuffle −50, combo reset"; vibe(25); render();
}
function armJoker(){
  if (game.joker <= 0 || bloomBusy) return;
  game.arming = !game.arming;
  toast = game.arming ? "Tap a free card to plant the joker" : "";
  render();
}
function doHint(){
  if (!game || game.hint <= 0 || bloomBusy) return;
  const free = freeCards();
  if (!free.length) { toast = "No free cards"; render(); return; }
  const pickC = free[Math.floor(Math.random() * free.length)];
  game.hint--;
  hintId = pickC.id;
  toast = "Hint";
  vibe(10); chimePick();
  render();
  setTimeout(() => { hintId = null; if (view === "play") render(); }, 1200);
}
function doPeek(){
  if (!game || game.peek <= 0 || bloomBusy) return;
  const buried = live(game.cards).filter(c => blocked(c, game.cards));
  if (!buried.length) { toast = "Nothing buried"; render(); return; }
  const pickC = buried[Math.floor(Math.random() * buried.length)];
  game.peek--;
  peekId = pickC.id;
  toast = "Peek";
  vibe(10); chimePick();
  render();
  setTimeout(() => { peekId = null; if (view === "play") render(); }, 1400);
}
function resolve(){
  if (!game || game.tray.length !== 5) return;
  const hand = game.tray;
  const ev = bestWithWild(hand);
  const combo = ev.cat === "high" ? 1 : Math.min(5, game.combo);
  const gained = ev.pts * combo;
  game.score += gained;
  game.combo = ev.cat === "high" ? 1 : Math.min(5, combo + 1);
  game.log.push({ name: NAMES[ev.cat], codes: hand.map(h => (h.wild ? "★" : "") + h.r + h.s), base: ev.pts, combo, gained });
  game.last = { name: NAMES[ev.cat], gained, combo };
  game.tray = []; game.snap = null;

  if (BLOOM_HANDS.has(ev.cat)) {
    bloomBusy = true;
    showBloom = { name: NAMES[ev.cat], math: `${ev.pts} × ${combo} = ${gained}` };
    toast = "";
    chimeBloom(); vibe([40, 40, 40, 40, 60]);
    render();
    setTimeout(() => {
      showBloom = null; bloomBusy = false;
      if (!live(game.cards).length) finish();
      else { autoLastHand(); }
      render();
    }, 1800);
  } else {
    toast = `${NAMES[ev.cat]}  ${ev.pts} ×${combo} = ${gained}`;
    if (ev.cat !== "high") { chimePair(); vibe(20); }
    if (!live(game.cards).length) finish();
  }
}
function finish(){
  const st = starsFor(game.score, game.level.target);
  save.stars[game.level.id] = Math.max(save.stars[game.level.id] || 0, st);
  save.best[game.level.id] = Math.max(save.best[game.level.id] || 0, game.score);
  save.unlocked = Math.max(save.unlocked, game.level.n + 1);
  writeSave(save);
  view = "clear";
}

function renderPlay(){

  }).join("");
  const stNow = starsFor(g.score, g.level.target);
  return `<div class="play-screen">
    ${g.combo > 1 ? `<div class="combo-banner">COMBO ×${g.combo}</div>` : ""}
    <div class="board-area">
      <div class="board">${cards}</div>
      <div class="status-line" style="position:absolute;left:4px;right:4px;bottom:2px;z-index:8">Score ${g.score} · left ${live(g.cards).length} · 3★ at ${Math.floor(g.level.target * 0.9)} · now ${stNow}/3</div>
      ${toast ? `<div class="toast">${toast}</div>` : ""}
      ${showBloom ? `<div class="bloom"><div class="hand-name">${showBloom.name}</div><div class="hand-math">${showBloom.math}</div></div>` : ""}
    </div>
    <div class="footer">
      <div class="tray">${tray}</div>
      <div class="wells">
        <button type="button" class="well" id="hintBtn" ${g.hint ? "" : "disabled"}><b>💡</b>HINT ${g.hint}</button>
        <button type="button" class="well" id="peekBtn" ${g.peek ? "" : "disabled"}><b>👁</b>PEEK ${g.peek}</button>
        <button type="button" class="well" id="undoBtn" ${g.undo ? "" : "disabled"}><b>↺</b>UNDO ${g.undo}</button>
        <button type="button" class="well" id="jokerBtn" ${g.joker ? "" : "disabled"}><b>★</b>JOKER ${g.joker}</button>
        <button type="button" class="well" id="shufBtn" ${g.shuffle ? "" : "disabled"}><b>⇄</b>SHUFFLE ${g.shuffle}</button>
      </div>
    </div>
  </div>`;
}
function renderClear(){
  const g = game, st = starsFor(g.score, g.level.target);
  const log = g.log.map(row => `<div><span>${row.codes.join(" ")} — ${row.name}</span><span>${row.base} ×${row.combo} = ${row.gained}</span></div>`).join("");
  const sum = g.log.reduce((n, r) => n + r.gained, 0);
  return `<div class="modal-back"><div class="modal"><h2>Garden cleared</h2>
    <p style="text-align:center;margin:4px">${g.level.name}</p>
    <p style="text-align:center;font-size:26px;color:#8a6a1e;margin:4px">${"★".repeat(st)}${"☆".repeat(3 - st)}</p>
    <p style="text-align:center;font-size:32px;margin:4px 0">${g.score}</p>
    <div class="log">${log}<div><strong>Total</strong><strong>${sum}</strong></div></div>
    <div class="actions" style="justify-content:center">
      <button type="button" class="ghost" id="toRoad">Road</button>
      <button type="button" class="gold" id="nextLv">Next bed</button>
    </div>
  </div></div>`;
}
function splashHTML(){
  const faces = ["AH", "KD", "QS", "JC", "10H"];
  return `<div class="splash" id="splash">
    <div class="splash-cards">
      ${faces.map(c => `<div class="splash-card"><img src="${faceFile(c)}" alt="${c}"/></div>`).join("")}
    </div>
    <div class="splash-word"><span class="z">Zen</span><span class="p">Poker</span></div>
    <div class="splash-hint">Tap to enter the garden</div>
  </div>`;
}
function hud(){
  const st = view === "play" && game ? starsFor(game.score, game.level.target) : 0;
  return `<header class="hud">
    <div class="brand" id="brandTap">❧ Zen Poker</div>
    ${view === "road"
      ? `<span class="road-label">GARDEN ROAD</span><div class="pill">STARS ${totalStars()} / 300</div>`
      : `<div class="pill">BED ${game.level.n}</div><div class="pill">${"★".repeat(st)}${"☆".repeat(3 - st)}</div><div class="pill">SCORE ${game.score}</div>`}
    <div class="spacer"></div>
    ${view === "play" ? `<button type="button" class="icon-btn" id="payHudBtn" title="Paytable">₱</button>` : ""}
    ${view !== "road" ? `<button type="button" class="icon-btn" id="backBtn" title="Back">←</button>` : ""}
    <button type="button" class="icon-btn" id="gearBtn" title="Settings">⚙</button>
  </header>`;
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="stage">
    <div class="frame"></div>
    <div class="corner tl">${ivySVG()}</div><div class="corner tr">${ivySVG()}</div>
    <div class="corner bl">${ivySVG()}</div><div class="corner br">${ivySVG()}</div>
    ${hud()}
    <div class="content">
      ${view === "road" ? renderRoad() : ""}
      ${view === "play" ? renderPlay() : ""}
      ${view === "clear" ? renderPlay() + renderClear() : ""}
    </div>
    ${showPay ? payModal() : ""}
    ${showSettings ? settingsModal() : ""}
    ${showSplash ? splashHTML() : ""}
    <div class="portrait-gate" id="portraitGate">
      <div class="rotate-icon">📱</div>
      <h1>Turn the garden</h1>
      <p>Rotate your phone to landscape</p>
    </div>
  </div>`;
  bind();
  checkPortrait();
  if (view === "play" && game && !showPay && !showSettings && !bloomBusy && !showSplash) {
    clearTimeout(window._zenAuto);
    window._zenAuto = setTimeout(() => {
      if (view === "play" && game && !showPay && !showSettings && !bloomBusy && autoLastHand()) render();
    }, 220);
  }
}
function bind(){
  document.querySelectorAll(".chap-tab").forEach(el => {
    el.onclick = () => {
      chapterView = +el.dataset.ch;
      const first = LEVELS.find(l => l.chapter === chapterView && isUnlocked(l.n))
        || LEVELS.find(l => l.chapter === chapterView);
      if (first) selected = first;
      render();
    };
  });
  document.querySelectorAll(".node").forEach(n => {
    n.onclick = () => {
      const lv = LEVELS.find(l => l.id === n.dataset.id);
      if (!lv || !isUnlocked(lv.n)) return;
      selected = lv; render();
    };
  });
  const play = document.getElementById("playBtn");
  if (play) play.onclick = () => { ensureAudio(); syncPad(); startLevel(selected); };
  const payBtn = document.getElementById("payBtn");
  if (payBtn) payBtn.onclick = () => { showPay = true; showSettings = false; render(); };
  const payHud = document.getElementById("payHudBtn");
  if (payHud) payHud.onclick = () => { showPay = true; showSettings = false; render(); };
  const gear = document.getElementById("gearBtn");
  if (gear) gear.onclick = () => { showSettings = true; showPay = false; render(); };
  ["payClose", "payClose2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onclick = () => { showPay = false; render(); };
  });
  ["setClose", "setClose2"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.onclick = () => { showSettings = false; render(); };
  });
  const setPay = document.getElementById("setPayBtn");
  if (setPay) setPay.onclick = () => { showSettings = false; showPay = true; render(); };
  document.querySelectorAll("[data-tog]").forEach(el => {
    el.onclick = () => {
      const k = el.dataset.tog;
      save.settings[k] = !save.settings[k];
      writeSave(save);
      syncPad();
      render();
    };
  });
  const ru = document.getElementById("reviewUnlock");
  if (ru) ru.onclick = () => {
    save.reviewUnlocked = true;
    save.unlocked = Math.max(save.unlocked, 100);
    writeSave(save);
    toast = "All beds unlocked";
    render();
  };
  const rg = document.getElementById("reviewGo");
  if (rg) rg.onclick = () => {
    const inp = document.getElementById("reviewNum");
    const n = Math.max(1, Math.min(100, parseInt(inp && inp.value, 10) || 0));
    if (!n) return;
    if (!save.reviewUnlocked && n > save.unlocked) {
      toast = "Unlock review first, or clear earlier beds";
      render(); return;
    }
    const lv = LEVELS.find(l => l.n === n);
    if (!lv) return;
    selected = lv; chapterView = lv.chapter;
    showSettings = false;
    startLevel(lv);
  };
  document.querySelectorAll(".card").forEach(el => {
    el.onclick = () => pick(+el.dataset.id);
  });
  const hintB = document.getElementById("hintBtn"); if (hintB) hintB.onclick = doHint;
  const peekB = document.getElementById("peekBtn"); if (peekB) peekB.onclick = doPeek;
  const u = document.getElementById("undoBtn"); if (u) u.onclick = undo;
  const j = document.getElementById("jokerBtn"); if (j) j.onclick = armJoker;
  const s = document.getElementById("shufBtn"); if (s) s.onclick = shuffle;
  const b = document.getElementById("backBtn");
  if (b) b.onclick = () => { view = "road"; game = null; toast = ""; render(); };
  const r = document.getElementById("toRoad");
  if (r) r.onclick = () => { view = "road"; game = null; toast = ""; render(); };
  const n = document.getElementById("nextLv");
  if (n) n.onclick = () => {
    const nxt = LEVELS.find(l => l.n === game.level.n + 1);
    if (nxt) startLevel(nxt);
    else { view = "road"; game = null; render(); }
  };
  const splash = document.getElementById("splash");
  if (splash) splash.onclick = () => {
    showSplash = false;
    save.splashSeen = true;
    writeSave(save);
    ensureAudio(); syncPad();
    render();
  };
  const brand = document.getElementById("brandTap");
  if (brand) brand.onclick = () => {
    brandTaps++;
    clearTimeout(brandTapTimer);
    brandTapTimer = setTimeout(() => { brandTaps = 0; }, 2000);
    if (brandTaps >= 7) {
      brandTaps = 0;
      save.reviewUnlocked = true;
      save.unlocked = Math.max(save.unlocked, 100);
      writeSave(save);
      showSettings = true;
      render();
    }
  };
}

render();
</script>
</body>
</html>
