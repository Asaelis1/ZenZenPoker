<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zen Poker — Garden Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --felt: #0e3a27;
    --felt2: #145c3a;
    --ivory: #f6edd8;
    --brass: #d4af5a;
    --brass2: #f0d48a;
    --burgundy: #9a2f2f;
    --pipg: #1a4a30;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #06140c; color: var(--ivory); font-family: "Source Sans 3", sans-serif; }
  #app { min-height: 100%; padding: 10px; }
  .stage {
    position: relative; min-height: calc(100vh - 20px);
    border-radius: 22px; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 38%, #1a6a42 0%, var(--felt2) 38%, var(--felt) 72%, #07180f 100%);
    box-shadow: 0 0 0 3px #8a6a2a, 0 0 0 6px #d4af5a, 0 0 0 8px #6d5318, inset 0 0 120px rgba(0,0,0,.28);
  }
  .frame {
    pointer-events: none; position: absolute; inset: 14px; border-radius: 14px;
    border: 1.5px solid rgba(212,175,90,.75);
    box-shadow: inset 0 0 0 6px rgba(14,58,39,.0);
  }
  .frame:after {
    content: ""; position: absolute; inset: 7px; border-radius: 10px;
    border: 1px solid rgba(240,212,138,.35);
  }
  .corner { position: absolute; width: 120px; height: 120px; pointer-events: none; z-index: 8; }
  .corner.tl { top: 0; left: 0; } .corner.tr { top: 0; right: 0; transform: scaleX(-1); }
  .corner.bl { bottom: 0; left: 0; transform: scaleY(-1); } .corner.br { bottom: 0; right: 0; transform: scale(-1); }
  header.hud {
    position: relative; z-index: 6;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 16px 22px 8px 28px;
  }
  .brand {
    font-family: "Cormorant Garamond", serif; font-size: 28px; color: var(--brass2);
    display: flex; align-items: center; gap: 8px; letter-spacing: .03em;
  }
  .pill {
    border: 1.5px solid var(--brass); border-radius: 999px; padding: 5px 14px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #f3e2b0;
    background: linear-gradient(180deg, rgba(20,50,32,.75), rgba(8,24,16,.75));
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--brass);
    background: radial-gradient(circle at 40% 30%, #1d5a38, #0c2418); color: var(--brass2);
    cursor: pointer; font-size: 16px;
  }
  .spacer { flex: 1; }
  .combo-banner {
    margin: 0 auto 6px; width: max-content; z-index: 6; position: relative;
    border: 1px solid var(--brass); border-radius: 999px; padding: 3px 18px;
    color: var(--brass2); letter-spacing: .16em; font-size: 11px;
    background: rgba(8,24,16,.55);
  }
  .screen { position: relative; z-index: 5; padding: 6px 22px 18px; }
  .road { display: grid; grid-template-columns: 1.35fr .75fr; gap: 18px; }
  @media (max-width: 860px) { .road { grid-template-columns: 1fr; } }
  .path {
    min-height: 360px; border-radius: 18px; padding: 12px;
    background:
      radial-gradient(circle at 20% 70%, rgba(90,140,70,.18), transparent 40%),
      linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.18));
  }
  .chapter { font-size: 11px; letter-spacing: .2em; color: var(--brass); margin: 4px 0 12px; }
  .nodes { display: flex; flex-wrap: wrap; gap: 16px; }
  .node {
    width: 70px; height: 70px; border-radius: 50%; cursor: pointer;
    border: 2px solid #8a6a2a; color: #f0d48a;
    background: radial-gradient(circle at 35% 30%, #2a6a40, #102418);
    box-shadow: 0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
    font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .node.on { border-color: #f0d48a; box-shadow: 0 0 0 4px rgba(212,175,90,.35), 0 0 24px rgba(240,212,138,.35); }
  .node.lock { opacity: .42; cursor: not-allowed; filter: grayscale(.3); }
  .node small { font-size: 10px; color: var(--brass); }
  .panel {
    background: linear-gradient(180deg, rgba(18,42,28,.88), rgba(8,22,16,.92));
    border: 1.5px solid var(--brass); border-radius: 16px; padding: 18px;
    box-shadow: 0 16px 30px rgba(0,0,0,.28);
  }
  .panel h2 { font-family: "Cormorant Garamond", serif; margin: 0 0 6px; color: #f6edd8; font-size: 30px; }
  .panel p { margin: 6px 0; color: #e4d5ae; }
  button.gold, button.ghost {
    cursor: pointer; border-radius: 12px; padding: 11px 16px; letter-spacing: .1em;
    text-transform: uppercase; font-weight: 700;
  }
  button.gold {
    background: linear-gradient(180deg, #f0d48a, #c49a3e); color: #1b1406; border: 0;
    box-shadow: 0 4px 0 #7a5c1c;
  }
  button.ghost { background: transparent; color: var(--brass2); border: 1.5px solid var(--brass); }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .table-wrap { position: relative; height: min(56vh, 460px); z-index: 5; }
  .board { position: absolute; inset: 0 8px 0 8px; }
  .backs { position: absolute; inset: 18% 12% 28%; pointer-events: none; }
  .back-card {
    position: absolute; width: 86px; height: 120px; border-radius: 10px;
    background: linear-gradient(160deg, #1f6a42, #0d3a24);
    border: 2px solid #d4af5a; box-shadow: 0 8px 16px rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: absolute; width: 90px; height: 135px; border: 0; padding: 0;
    background: transparent; cursor: pointer;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.32));
    transition: transform .15s ease;
  }
  .card img, .slot img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .card:not(.blocked):hover { transform: translateY(-7px); }
  .card.blocked { cursor: default; filter: brightness(.78) drop-shadow(0 6px 8px rgba(0,0,0,.3)); }
  .card.wild { outline: 2px solid #b23a3a; outline-offset: -2px; border-radius: 12px; }
  .wild-dot {
    position: absolute; right: 6px; bottom: 8px; width: 18px; height: 18px; border-radius: 50%;
    background: #9a2f2f; color: #f6edd8; font-size: 11px; line-height: 18px; text-align: center;
  }
  .footer {
    position: relative; z-index: 6;
    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end;
    padding: 4px 22px 16px;
  }
  .tray {
    display: flex; gap: 8px; min-height: 108px; padding: 10px 12px;
    border: 1.5px solid var(--brass); border-radius: 16px;
    background: rgba(6,20,12,.35);
  }
  .slot { width: 70px; height: 105px; position: relative; }
  .slot.empty {
    border-radius: 8px; border: 1px dashed rgba(212,175,90,.35);
    background: rgba(246,237,216,.06);
  }
  .wells { display: flex; gap: 12px; }
  .well {
    width: 88px; height: 88px; border-radius: 50%; cursor: pointer;
    border: 2.5px solid var(--brass);
    background: radial-gradient(circle at 35% 30%, #1b5a38, #0a2418);
    color: var(--brass2); letter-spacing: .08em; font-size: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: inset 0 0 0 3px rgba(14,58,39,.65), 0 8px 16px rgba(0,0,0,.28);
  }
  .well:disabled { opacity: .38; cursor: not-allowed; }
  .well b { font-size: 22px; font-weight: 500; }
  .toast {
    position: absolute; left: 50%; top: 54px; transform: translateX(-50%); z-index: 9;
    background: #13281c; border: 1px solid var(--brass); color: #f3e6c2;
    padding: 6px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  }
  .modal-back {
    position: absolute; inset: 0; background: rgba(4,12,8,.62); z-index: 12;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    width: min(560px, 94vw); background: #f6edd8; color: #1c2a22; border-radius: 18px;
    border: 2px solid #c7a24a; padding: 22px; box-shadow: 0 24px 50px rgba(0,0,0,.45);
  }
  .modal h2 { font-family: "Cormorant Garamond", serif; margin: 0 0 8px; text-align: center; font-size: 34px; }
  .pay { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 4px 16px; font-size: 13px; }
  .log { font-size: 13px; border-top: 1px solid #d8c394; margin-top: 10px; padding-top: 8px; }
  .log div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .note { font-size: 12px; color: #d7c48a; padding: 0 22px 10px; position: relative; z-index: 6; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const PAY = { high:25, pair:50, twopair:120, three:200, straight:400, flush:500, full:700, four:900, five:1600, sflush:1400, royal:2000 };
const NAMES = { high:"High Card", pair:"Pair", twopair:"Two Pair", three:"Three of a Kind", straight:"Straight", flush:"Flush", full:"Full House", four:"Four of a Kind", five:"Five of a Kind", sflush:"Straight Flush", royal:"Royal Flush" };
const ORDER = ["high","pair","twopair","three","straight","flush","full","four","five","sflush","royal"];
const SUITS = ["H","D","C","S"];
const PIPS = {H:"♥",D:"♦",C:"♣",S:"♠"};
const RV = {A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2};
function parse(code){ return {r: code.slice(0,-1), s: code.slice(-1)}; }
function isRed(s){ return s==="H"||s==="D"; }
function classify(cards){
  const ranks = cards.map(c => RV[c.r]).sort((a,b)=>b-a);
  const suits = cards.map(c => c.s);
  const flush = suits.every(s => s===suits[0]);
  const uniq = [...new Set(ranks)];
  let straight = 0;
  if (uniq.length===5 && uniq[0]-uniq[4]===4) straight = uniq[0];
  if (String(uniq)==="14,5,4,3,2") straight = 5;
  const counts = {}; ranks.forEach(v => counts[v]=(counts[v]||0)+1);
  const sig = Object.values(counts).sort((a,b)=>b-a).join("");
  if (flush && straight===14) return "royal";
  if (flush && straight) return "sflush";
  if (sig==="5") return "five";
  if (sig==="41") return "four";
  if (sig==="32") return "full";
  if (flush) return "flush";
  if (straight) return "straight";
  if (sig==="311") return "three";
  if (sig==="221") return "twopair";
  if (sig==="2111") return "pair";
  return "high";
}
function bestWithWild(cards){
  const wilds = cards.filter(c => c.wild);
  const plain = cards.filter(c => !c.wild);
  if (!wilds.length) { const cat = classify(cards); return {cat, pts: PAY[cat]}; }
  let best = {cat:"high", pts: PAY.high};
  for (const r of Object.keys(RV)) for (const s of SUITS) {
    const cat = classify(plain.concat(wilds.map(()=>({r,s}))));
    if (ORDER.indexOf(cat) > ORDER.indexOf(best.cat)) best = {cat, pts: PAY[cat]};
  }
  return best;
}
function pack(rows){
  let id = 1;
  return rows.flatMap(row => row.codes.map((code, i) => ({
    id: id++, code, x: row.x0 + i * row.gap, y: row.y, z: row.z
  })));
}
const LEVELS = [
  {id:"lantern", n:1, name:"Lantern", ch:"The Hedge", target:250, cards: pack([
    {codes:["AH","7C","KS","QD","10C","4H","9S"], x0:6, gap:12, y:4, z:2},
    {codes:["3D","JC","6H","QS","8D","2C","10H"], x0:10, gap:12, y:26, z:1},
    {codes:["5S","9H","KC","7D","3C","2S"], x0:14, gap:12, y:46, z:0}
  ])},
  {id:"rail", n:2, name:"Quiet Rail", ch:"The Hedge", target:420, cards: pack([
    {codes:["QH","QC","10H","10S","AH","4D","2H"], x0:6, gap:12, y:2, z:3},
    {codes:["9D","8D","7D","6D","5D","KS","4C"], x0:10, gap:12, y:20, z:2},
    {codes:["2S","JH","3S","8C","AD","7C"], x0:14, gap:12, y:38, z:1}
  ])},
  {id:"grove", n:3, name:"Moss Grove", ch:"The Hedge", target:560, cards: pack([
    {codes:["AS","KS","QS","JS","10S","9S","8S"], x0:6, gap:12, y:2, z:3},
    {codes:["9H","9C","5H","5D","3C","7H","8C"], x0:10, gap:12, y:20, z:2},
    {codes:["2D","4H","6C","QD","KH","AC"], x0:14, gap:12, y:38, z:1}
  ])},
  {id:"orchard", n:4, name:"Orchard Gate", ch:"The Orchard", target:720, cards: pack([
    {codes:["KH","KD","KC","4H","4S","AH","2C"], x0:4, gap:12, y:1, z:3},
    {codes:["JH","QH","10H","9C","8S","3D","6D"], x0:8, gap:12, y:18, z:2},
    {codes:["2D","6C","7S","3H","AC","9H","5C"], x0:12, gap:12, y:34, z:1},
    {codes:["8D","JS","4D","7C"], x0:20, gap:12, y:50, z:0}
  ])},
  {id:"lantern2", n:5, name:"Twin Lamps", ch:"The Orchard", target:900, cards: pack([
    {codes:["AH","AD","AC","8H","8D","KS","QS"], x0:4, gap:12, y:1, z:3},
    {codes:["KH","QH","JH","10H","9S","9C","2S"], x0:8, gap:12, y:18, z:2},
    {codes:["3C","7D","6H","5S","4C","JD","2H"], x0:12, gap:12, y:34, z:1},
    {codes:["10C","4D","6S","3H"], x0:20, gap:12, y:50, z:0}
  ])},
  {id:"crown", n:6, name:"Garden Crown", ch:"The Crown", target:1400, cards: pack([
    {codes:["AH","KH","QH","JH","10H","9H","8H"], x0:4, gap:12, y:0, z:4},
    {codes:["AS","KS","QS","JS","10S","9S","8S"], x0:8, gap:12, y:14, z:3},
    {codes:["9D","9C","5D","5C","3D","7C","6C"], x0:12, gap:12, y:28, z:2},
    {codes:["2C","4D","6H","QD","KC","AD","2S","4H","7S"], x0:8, gap:10, y:44, z:1}
  ])}
];
const SAVE_KEY = "zen-poker-web-review-v2";
function storage(){
  try {
    const ls = window.localStorage;
    ls.getItem(SAVE_KEY);
    return ls;
  } catch {
    return null;
  }
}
function loadSave(){
  try {
    const ls = storage();
    if (!ls) return {stars:{}, best:{}, unlocked:1};
    return JSON.parse(ls.getItem(SAVE_KEY) || "null") || {stars:{}, best:{}, unlocked:1};
  } catch {
    return {stars:{}, best:{}, unlocked:1};
  }
}
function writeSave(s){
  try {
    const ls = storage();
    if (ls) ls.setItem(SAVE_KEY, JSON.stringify(s));
  } catch {}
}
function starsFor(score, target){
  if (score<=0) return 0;
  if (score >= Math.floor(target*0.9)) return 3;
  if (score >= Math.floor(target*0.55)) return 2;
  return 1;
}
let save = loadSave(), view="road", selected=LEVELS[0], game=null, toast="", showPay=false;
function cloneLevel(lv){ return lv.cards.map(c => ({...c, gone:false, wild:false})); }
function startLevel(lv){
  selected = lv;
  game = { level:lv, cards:cloneLevel(lv), tray:[], score:0, combo:1, log:[], undo:3, shuffle:3, joker:1, arming:false, snap:null, last:null };
  view="play"; render();
}
function rect(c){ return {x:c.x,y:c.y,w:12,h:24}; }
function overlap(a,b){
  const A=rect(a), B=rect(b);
  const x=Math.max(0, Math.min(A.x+A.w,B.x+B.w)-Math.max(A.x,B.x));
  const y=Math.max(0, Math.min(A.y+A.h,B.y+B.h)-Math.max(A.y,B.y));
  return (x*y)/(A.w*A.h) > 0.18;
}
function blocked(card, cards){ return cards.some(o => !o.gone && o.z>card.z && overlap(card,o)); }
function live(cards){ return cards.filter(c => !c.gone); }
function norm(code){ return code.replace("10","T"); }
function toTray(c){
  if (c.gone) return;
  c.gone = true;
  game.tray.push({...parse(norm(c.code)), code:norm(c.code), wild:!!c.wild, id:c.id});
}
function freeCards(){
  return live(game.cards).filter(c => !blocked(c, game.cards));
}
function autoLastHand(){
  if (!game || game.arming) return false;
  const left = live(game.cards);
  const free = freeCards();
  const trayN = game.tray.length;
  let take = null;
  if (left.length && left.length + trayN === 5) take = left;
  else if (free.length && free.length + trayN === 5) take = free;
  if (!take) return false;
  if (!trayN) game.snap = snapshot();
  take.forEach(toTray);
  if (game.tray.length === 5) resolve();
  return true;
}
function pick(id){
  const c = game.cards.find(x => x.id===id);
  if (!c || c.gone || blocked(c, game.cards)) return;
  if (game.arming){ c.wild=true; game.arming=false; game.joker=0; toast="Joker armed on "+c.code; render(); return; }
  if (game.tray.length>=5) return;
  if (!game.tray.length) game.snap = snapshot();
  toTray(c);
  if (game.tray.length===5) resolve();
  else autoLastHand();
  render();
}
function snapshot(){ return JSON.parse(JSON.stringify({cards:game.cards,tray:game.tray,score:game.score,combo:game.combo,log:game.log,joker:game.joker})); }
function undo(){
  if (game.undo<=0 || !game.snap) return;
  Object.assign(game, JSON.parse(JSON.stringify(game.snap)));
  game.undo--; game.snap=null; game.arming=false; toast="Undo"; render();
}
function shuffle(){
  if (game.shuffle<=0) return;
  const open = live(game.cards);
  const codes = open.map(c => c.code);
  for (let i=codes.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [codes[i],codes[j]]=[codes[j],codes[i]]; }
  open.forEach((c,i)=>{ c.code=codes[i]; c.wild=false; });
  game.shuffle--; game.combo=1; game.score=Math.max(0, game.score-50); toast="Shuffle −50, combo reset"; render();
}
function armJoker(){ if (game.joker<=0) return; game.arming=!game.arming; toast=game.arming?"Tap a free card to make it wild":""; render(); }
function resolve(){
  if (!game || game.tray.length !== 5) return;
  const hand=game.tray;
  const ev=bestWithWild(hand);
  const combo = ev.cat==="high" ? 1 : Math.min(5, game.combo);
  const gained = ev.pts * combo;
  game.score += gained;
  game.combo = ev.cat==="high" ? 1 : Math.min(5, combo+1);
  game.log.push({name:NAMES[ev.cat], codes:hand.map(h=>(h.wild?"★":"")+h.r+h.s), base:ev.pts, combo, gained});
  game.last={name:NAMES[ev.cat], gained, combo}; game.tray=[]; game.snap=null;
  toast = `${NAMES[ev.cat]}  ${ev.pts} ×${combo} = ${gained}`;
  if (!live(game.cards).length) finish();
}
function finish(){
  const st=starsFor(game.score, game.level.target);
  save.stars[game.level.id]=Math.max(save.stars[game.level.id]||0, st);
  save.best[game.level.id]=Math.max(save.best[game.level.id]||0, game.score);
  save.unlocked=Math.max(save.unlocked, game.level.n+1);
  writeSave(save); view="clear";
}
function totalStars(){ return LEVELS.reduce((n,l)=>n+(save.stars[l.id]||0),0); }

function ivySVG(){
  return `<svg class="corner-svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
    <path d="M8 86c18-8 28-28 26-48 14 8 18 24 12 40 16-10 34-8 48 4-18 6-38 4-52-8-4 14-16 26-34 30z" fill="#3f7a4a"/>
    <path d="M18 70c10-18 8-36-2-48 16 4 24 18 22 34 12-14 28-16 40-8-16 10-30 8-40 0-2 12-10 22-20 22z" fill="#6ea25a"/>
    <path d="M10 40c12-6 16-20 10-32 10 8 10 20 4 28 10-4 20 0 28 8-12 2-22-2-28-8 0 8-6 14-14 16z" fill="#87b56a"/>
    <circle cx="22" cy="28" r="3" fill="#d4af5a"/>
  </svg>`;
}
function faceFile(code){
  const n = norm(code);
  const {r,s} = parse(n);
  const rank = r === "T" ? "10" : r;
  return "cards/" + rank + s + ".png";
}
function cardFace(code, wild){
  return `<img src="${faceFile(code)}" alt="${code}" width="256" height="384"/>${wild?'<span class="wild-dot">★</span>':''}`;
}
function cardBack(){
  return `<img src="cards/BACK.png" alt="back" width="256" height="384"/>`;
}
function renderRoad(){
  const nodes = LEVELS.map(l => {
    const locked = l.n > save.unlocked;
    const st = save.stars[l.id]||0;
    const on = selected && selected.id===l.id;
    return `<button class="node ${locked?"lock":""} ${on?"on":""}" data-id="${l.id}">${locked?"🔒":l.n}<small>${"★".repeat(st)}${"☆".repeat(3-st)}</small></button>`;
  }).join("");
  const l = selected, st = save.stars[l.id]||0;
  return `<div class="screen"><div class="chapter">GARDEN ROAD</div>
    <div class="road"><div class="path"><div class="chapter">THE HEDGE · THE ORCHARD · THE CROWN</div><div class="nodes">${nodes}</div></div>
    <div class="panel"><h2>${l.name}</h2>
      <p>Level ${l.n} · ${l.ch}</p><p>${l.cards.length} cards on the table</p>
      <p>1★ clear · 2★ ${Math.floor(l.target*0.55)} · 3★ ${Math.floor(l.target*0.9)}</p>
      <p>Best ${save.best[l.id]||0} · ${"★".repeat(st)}${"☆".repeat(3-st)}</p>
      <div class="actions"><button class="ghost" id="payBtn">Paytable</button><button class="gold" id="playBtn">Enter the garden</button></div>
    </div></div></div>`;
}
function payModal(){
  const rows = ORDER.map(k => `<div>${NAMES[k]}</div><div>${PAY[k]}</div>`).join("");
  return `<div class="modal-back" id="payClose"><div class="modal" onclick="event.stopPropagation()">
    <h2>Paytable</h2><div class="pay">${rows}</div>
    <p style="font-size:13px;margin-top:10px">Pair or better raises combo up to ×5. High card pays 25 and resets combo. Joker is wild. Shuffle costs 50 and resets combo.</p>
    <div class="actions"><button class="gold" id="payClose2">Close</button></div></div></div>`;
}
function renderPlay(){
  const g=game;
  const cards = g.cards.filter(c=>!c.gone).map(c => {
    const b = blocked(c, g.cards);
    const art = b ? cardBack() : cardFace(c.code,c.wild);
    return `<button class="card ${b?"blocked":""} ${c.wild?"wild":""}" data-id="${c.id}" style="left:${c.x}%;top:${c.y}%;z-index:${c.z+3}">${art}</button>`;
  }).join("");
  const tray = Array.from({length:5},(_,i)=>{
    const h=g.tray[i];
    return `<div class="slot ${h?"":"empty"}">${h?cardFace((h.r==="T"?"10":h.r)+h.s,h.wild):""}</div>`;
  }).join("");
  const stNow = starsFor(g.score, g.level.target);
  return `${g.combo>1?`<div class="combo-banner">COMBO ×${g.combo}</div>`:""}
    <div class="table-wrap"><div class="board">${cards}</div>
      ${toast?`<div class="toast">${toast}</div>`:""}
    </div>
    <div class="footer"><div class="tray">${tray}</div>
      <div class="wells">
        <button class="well" id="undoBtn" ${g.undo?"":"disabled"}><b>↺</b>UNDO ${g.undo}</button>
        <button class="well" id="jokerBtn" ${g.joker?"":"disabled"}><b>★</b>JOKER ${g.joker}</button>
        <button class="well" id="shufBtn" ${g.shuffle?"":"disabled"}><b>⇄</b>SHUFFLE ${g.shuffle}</button>
      </div></div>
    <div class="note">Score ${g.score} · left ${live(g.cards).length} · 3★ at ${Math.floor(g.level.target*0.9)} · now ${stNow}/3</div>`;
}
function renderClear(){
  const g=game, st=starsFor(g.score,g.level.target);
  const log=g.log.map(row=>`<div><span>${row.codes.join(" ")} — ${row.name}</span><span>${row.base} ×${row.combo} = ${row.gained}</span></div>`).join("");
  const sum=g.log.reduce((n,r)=>n+r.gained,0);
  return `<div class="modal-back"><div class="modal"><h2>Garden cleared</h2>
    <p style="text-align:center">${g.level.name}</p>
    <p style="text-align:center;font-size:28px;color:#8a6a1e">${"★".repeat(st)}${"☆".repeat(3-st)}</p>
    <p style="text-align:center;font-size:34px;margin:4px 0">${g.score}</p>
    <div class="log">${log}<div><strong>Total</strong><strong>${sum}</strong></div></div>
    <div class="actions" style="justify-content:center">
      <button class="ghost" id="toRoad">Road</button><button class="gold" id="nextLv">Next level</button>
    </div></div></div>`;
}
function hud(){
  const st = view==="play" ? starsFor(game.score, game.level.target) : 0;
  return `<header class="hud">
    <div class="brand">❧ Zen Poker</div>
    <div class="pill">${view==="play"?("LEVEL "+game.level.n):"GARDEN ROAD"}</div>
    ${view==="play"?`<div class="pill">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="pill">SCORE ${game.score}</div><div class="pill">Clear the garden</div>`
      :`<div class="pill">STARS ${totalStars()} / 18</div>`}
    <div class="spacer"></div>
    ${view!=="road"?`<button class="icon-btn" id="backBtn">←</button>`:""}
    <button class="icon-btn" id="payBtn2">⚙</button>
  </header>`;
}
function render(){
  document.getElementById("app").innerHTML = `<div class="stage">
    <div class="frame"></div>
    <div class="corner tl">${ivySVG()}</div><div class="corner tr">${ivySVG()}</div>
    <div class="corner bl">${ivySVG()}</div><div class="corner br">${ivySVG()}</div>
    ${hud()}
    ${view==="road"?renderRoad():""}
    ${view==="play"?renderPlay():""}
    ${view==="clear"?renderPlay()+renderClear():""}
    ${showPay?payModal():""}
  </div>`;
  bind();
  if (view==="play" && game && !showPay) {
    clearTimeout(window._zenAuto);
    window._zenAuto = setTimeout(() => {
      if (view==="play" && game && !showPay && autoLastHand()) render();
    }, 220);
  }
}
function bind(){
  document.querySelectorAll(".node").forEach(n => n.onclick = () => {
    const lv = LEVELS.find(l => l.id===n.dataset.id); if (lv.n>save.unlocked) return; selected=lv; render();
  });
  const play=document.getElementById("playBtn"); if (play) play.onclick=()=>startLevel(selected);
  ["payBtn","payBtn2"].forEach(id=>{ const el=document.getElementById(id); if(el) el.onclick=()=>{showPay=true;render();}; });
  ["payClose","payClose2"].forEach(id=>{ const el=document.getElementById(id); if(el) el.onclick=()=>{showPay=false;render();}; });
  document.querySelectorAll(".card").forEach(el => el.onclick=()=>pick(+el.dataset.id));
  const u=document.getElementById("undoBtn"); if(u) u.onclick=undo;
  const j=document.getElementById("jokerBtn"); if(j) j.onclick=armJoker;
  const s=document.getElementById("shufBtn"); if(s) s.onclick=shuffle;
  const b=document.getElementById("backBtn"); if(b) b.onclick=()=>{view="road";game=null;render();};
  const r=document.getElementById("toRoad"); if(r) r.onclick=()=>{view="road";game=null;render();};
  const n=document.getElementById("nextLv"); if(n) n.onclick=()=>{ const nxt=LEVELS.find(l=>l.n===game.level.n+1); if(nxt) startLevel(nxt); else {view="road";game=null;render();} };
}
render();
</script>
</body>
</html>
